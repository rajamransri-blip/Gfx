name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      - run: flutter create fresh_app

      - run: |
          rm -rf fresh_app/lib
          cp -r lib fresh_app/

      - run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk