name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      # 🛠️ YAHAN FIX HAI: Zabardasti lowercase name aur proper organization ID di hai
      - name: Repair/Create Flutter Project Files
        run: flutter create --project-name gaming_tool --org com.raaz.gaming .

      # Storage Permissions Auto-Inject
      - name: Add Storage Permissions to Manifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Tool-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
