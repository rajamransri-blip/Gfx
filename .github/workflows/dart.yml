name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"

      - name: Create Fresh Flutter Project
        run: flutter create fresh_app

      - name: Copy Source Code
        run: |
          rm -rf fresh_app/lib
          cp -r lib fresh_app/

      - name: Build APK
        run: |
          cd fresh_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk